<!DOCTYPE html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>初學集·卷八十｜錢謙益著作</title><style>:root{--bg:#f7f5f0;--card:#fff;--line:#ddd6c8;--fg:#2b2620;--fg2:#8a8272;--accent:#8c2f1f}
*{box-sizing:border-box;margin:0;padding:0;-webkit-text-size-adjust:100%}
body{font-family:"Noto Serif CJK SC","Source Han Serif SC",Georgia,"Songti SC",serif;background:var(--bg);color:var(--fg);line-height:2;padding:20px 14px 70px}
.wrap{max-width:760px;margin:0 auto}
h1{font-size:24px;letter-spacing:.06em;margin:8px 0 4px}
.sub{color:var(--fg2);font-size:13px;margin-bottom:20px}
h2{font-size:18px;margin:26px 0 10px;padding-left:10px;border-left:4px solid var(--accent)}
.card{display:block;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 16px;margin-bottom:8px;color:var(--fg);text-decoration:none;font-size:16px}
.meta{display:block;color:var(--fg2);font-size:12.5px;margin-top:2px}
.badge{display:inline-block;font-size:11.5px;border:1px solid var(--line);border-radius:99px;padding:0 9px;margin-left:8px;color:var(--fg2);vertical-align:1px}
.badge.ok{color:#3a6b35;border-color:#3a6b35}
.toc{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 18px;margin:14px 0}
.toc a{display:block;color:var(--fg);text-decoration:none;font-size:15px;padding:6px 0;border-bottom:1px dashed var(--line)}
.toc a:last-child{border-bottom:none}
.toc a:hover{color:var(--accent)}
.toc .grp{color:var(--accent);font-weight:700;font-size:14.5px;padding:10px 0 4px;border-bottom:none}
.toc .miss{color:var(--fg2);font-size:13.5px;padding:6px 0;border-bottom:1px dashed var(--line)}
.nav{display:flex;justify-content:space-between;gap:8px;position:sticky;bottom:0;background:var(--bg);padding:10px 0}
.nav a{color:var(--accent);text-decoration:none;font-size:14px;background:var(--card);border:1px solid var(--line);border-radius:99px;padding:6px 16px}
.text{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:22px 20px;margin-top:14px;font-size:17px;line-height:2.15;word-break:break-word;overflow-wrap:anywhere}
.text p{margin:0 0 1.2em;text-indent:2em}
.text p.noindent{text-indent:0}
.text p.hd{font-size:18.5px;font-weight:700;text-indent:0;margin:1.6em 0 .8em;color:var(--accent)}
.note-inline{color:var(--fg2);font-size:13.5px}
.jinglabel{color:var(--accent);font-size:13px;border:1px solid var(--accent);border-radius:4px;padding:0 5px;margin-right:5px;vertical-align:1.5px}
.note{font-size:13px;color:var(--fg2);margin-top:22px;line-height:1.8}
.note a{color:var(--accent)}
.back{font-size:13.5px}.back a{color:var(--accent);text-decoration:none}
.anno{margin:-.4em 0 1.6em;padding:7px 12px;border-left:3px solid var(--accent);background:rgba(140,47,31,.05);font-size:13.5px;color:var(--fg2);line-height:1.9}
.anno-tag{display:inline-block;font-size:11px;border:1px solid var(--accent);border-radius:3px;padding:0 5px;margin-right:6px;color:var(--accent);vertical-align:1.5px}</style>
<script>
(function(){
function pre(e){
var t=e.target;while(t&&t.tagName!=='A')t=t.parentElement;
if(t&&t.href&&t.origin===location.origin&&!t.__pf){t.__pf=1;
var l=document.createElement('link');l.rel='prefetch';l.href=t.href;document.head.appendChild(l);}
}
document.addEventListener('touchstart',pre,{passive:true});
document.addEventListener('mouseenter',pre,true);
})();
</script></head>

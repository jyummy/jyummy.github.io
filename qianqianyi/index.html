<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#070504">
<title>恩師錢公之靈位</title>
<link rel="preload" href="kai.woff2" as="font" type="font/woff2" crossorigin>
<style>
@font-face{font-family:"TabletKai";src:url(kai.woff2) format("woff2");font-display:block}
html,body{margin:0;height:100%;background:#070504;overflow:hidden;-webkit-tap-highlight-color:transparent}
#scene{position:fixed;inset:0;width:100%;height:100%;display:block}
#smoke{position:fixed;inset:0;width:100%;height:100%;pointer-events:none}
#vignette{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse 70% 62% at 50% 52%,rgba(0,0,0,0) 55%,rgba(0,0,0,.55) 100%)}
.char{font-family:"TabletKai","Kaiti TC","BiauKai","STKaiti","KaiTi",serif;text-anchor:middle;dominant-baseline:central}
#offer{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 2.2svh);transform:translateX(-50%);
  font-family:"TabletKai","Kaiti TC","KaiTi",serif;font-size:16px;letter-spacing:.6em;text-indent:.6em;
  color:#cfae6a;background:rgba(10,6,4,.55);border:1px solid rgba(207,174,106,.45);border-radius:2px;
  padding:7px 20px;cursor:pointer;transition:opacity .6s,border-color .3s;outline:none}
#offer:hover{border-color:rgba(207,174,106,.8)}
#offer:disabled{opacity:.25;cursor:default}
.fadein{animation:fadein 1.2s ease-out}
@keyframes fadein{from{opacity:0}to{opacity:1}}
</style>
</head>
<body>
<svg id="scene" viewBox="0 0 1600 844" preserveAspectRatio="xMidYMid slice" aria-label="恩師錢公諱謙益字受之號牧齋之靈位" role="img">
<defs>
  <radialGradient id="wallGlow" cx="800" cy="430" r="520" gradientUnits="userSpaceOnUse">
    <stop offset="0" stop-color="#3a2416"/><stop offset=".45" stop-color="#1c110a"/><stop offset="1" stop-color="#070504"/>
  </radialGradient>
  <linearGradient id="tableShade" x1="0" y1="620" x2="0" y2="782" gradientUnits="userSpaceOnUse">
    <stop offset="0" stop-color="#000" stop-opacity=".66"/><stop offset=".35" stop-color="#000" stop-opacity=".3"/><stop offset="1" stop-color="#000" stop-opacity=".08"/>
  </linearGradient>
  <linearGradient id="tableSide" x1="0" y1="0" x2="1600" y2="0" gradientUnits="userSpaceOnUse">
    <stop offset="0" stop-color="#000" stop-opacity=".85"/><stop offset=".36" stop-color="#000" stop-opacity=".25"/><stop offset=".5" stop-color="#000" stop-opacity="0"/><stop offset=".64" stop-color="#000" stop-opacity=".25"/><stop offset="1" stop-color="#000" stop-opacity=".85"/>
  </linearGradient>
  <linearGradient id="edge" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#7a4628"/><stop offset=".5" stop-color="#3a1c0f"/><stop offset="1" stop-color="#160905"/>
  </linearGradient>
  <radialGradient id="tableLight" cx="800" cy="690" r="300" gradientUnits="userSpaceOnUse" gradientTransform="translate(800 690) scale(1 .32) translate(-800 -690)">
    <stop offset="0" stop-color="#ffb35c" stop-opacity=".22"/><stop offset="1" stop-color="#ffb35c" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="softShadow"><stop offset="0" stop-color="#000" stop-opacity=".85"/><stop offset="1" stop-color="#000" stop-opacity="0"/></radialGradient>

  <!-- lacquer & gold -->
  <linearGradient id="lacquer" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#050302"/><stop offset=".12" stop-color="#16100c"/><stop offset=".3" stop-color="#0c0806"/><stop offset=".7" stop-color="#0c0806"/><stop offset=".88" stop-color="#17100c"/><stop offset="1" stop-color="#050302"/>
  </linearGradient>
  <linearGradient id="lacquerPanel" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#0a0705"/><stop offset=".5" stop-color="#110c09"/><stop offset="1" stop-color="#080504"/>
  </linearGradient>
  <linearGradient id="lacquerV" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#1c1410"/><stop offset=".5" stop-color="#0b0806"/><stop offset="1" stop-color="#040302"/>
  </linearGradient>
  <linearGradient id="gold" x1="0" y1="0" x2=".35" y2="1">
    <stop offset="0" stop-color="#fff0bf"/><stop offset=".28" stop-color="#e7bf62"/><stop offset=".55" stop-color="#a9772a"/><stop offset=".78" stop-color="#dcb35a"/><stop offset="1" stop-color="#7d561c"/>
  </linearGradient>
  <linearGradient id="goldLine" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#f3d58a"/><stop offset=".4" stop-color="#b8862f"/><stop offset=".7" stop-color="#e2bd68"/><stop offset="1" stop-color="#86601f"/>
  </linearGradient>
  <radialGradient id="pearl" cx=".38" cy=".35" r=".7">
    <stop offset="0" stop-color="#fff3c8"/><stop offset=".45" stop-color="#d9ad52"/><stop offset="1" stop-color="#6e4b16"/>
  </radialGradient>
  <pattern id="woodP" patternUnits="userSpaceOnUse" width="600" height="300"><image href="wood.jpg" width="600" height="300"/></pattern>

  <filter id="relief" x="-15%" y="-15%" width="130%" height="130%" color-interpolation-filters="sRGB">
    <feGaussianBlur in="SourceAlpha" stdDeviation=".7" result="b"/>
    <feOffset in="b" dx=".9" dy="1.2" result="o"/>
    <feFlood flood-color="#000" flood-opacity=".9"/>
    <feComposite in2="o" operator="in" result="sh"/>
    <feSpecularLighting in="b" surfaceScale="2.2" specularConstant=".8" specularExponent="16" lighting-color="#fff1c4" result="sp">
      <feDistantLight azimuth="230" elevation="42"/>
    </feSpecularLighting>
    <feComposite in="sp" in2="SourceAlpha" operator="in" result="spc"/>
    <feComposite in="SourceGraphic" in2="spc" operator="arithmetic" k1="0" k2="1" k3=".5" k4="0" result="lit"/>
    <feMerge><feMergeNode in="sh"/><feMergeNode in="lit"/></feMerge>
  </filter>
  <filter id="wear" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" seed="4" result="n"/>
    <feColorMatrix in="n" type="matrix" values="0 0 0 0 .55  0 0 0 0 .45  0 0 0 0 .35  0 0 0 .09 0"/>
    <feComposite in2="SourceAlpha" operator="in"/>
  </filter>
  <filter id="patina" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency=".06 .12" numOctaves="3" seed="9" result="n"/>
    <feColorMatrix in="n" type="matrix" values="0 0 0 0 .22  0 0 0 0 .32  0 0 0 0 .24  0 0 0 .7 -.25"/>
    <feComposite in2="SourceAlpha" operator="in"/>
  </filter>
  <filter id="blur3"><feGaussianBlur stdDeviation="3"/></filter>
  <filter id="blur1"><feGaussianBlur stdDeviation="1"/></filter>

  <!-- candle -->
  <linearGradient id="brass" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#2a1c0c"/><stop offset=".3" stop-color="#8a6830"/><stop offset=".45" stop-color="#e2c37a"/><stop offset=".6" stop-color="#9b7638"/><stop offset="1" stop-color="#21160a"/>
  </linearGradient>
  <linearGradient id="wax" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#4a0905"/><stop offset=".35" stop-color="#a8241a"/><stop offset=".5" stop-color="#c63a26"/><stop offset=".72" stop-color="#8a180f"/><stop offset="1" stop-color="#3a0603"/>
  </linearGradient>
  <linearGradient id="waxTop" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#ff9a4a" stop-opacity=".9"/><stop offset="1" stop-color="#c63a26" stop-opacity="0"/>
  </linearGradient>
  <radialGradient id="flame" cx=".5" cy=".72" r=".62">
    <stop offset="0" stop-color="#fffbe8"/><stop offset=".3" stop-color="#fff0a8"/><stop offset=".6" stop-color="#ffb53c"/><stop offset=".85" stop-color="#ff7414" stop-opacity=".75"/><stop offset="1" stop-color="#ff5a00" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="halo"><stop offset="0" stop-color="#ffc070" stop-opacity=".55"/><stop offset=".25" stop-color="#ff9a40" stop-opacity=".2"/><stop offset="1" stop-color="#ff7a20" stop-opacity="0"/></radialGradient>
  <radialGradient id="reflect"><stop offset="0" stop-color="#ffc070" stop-opacity=".35"/><stop offset="1" stop-color="#ffc070" stop-opacity="0"/></radialGradient>

  <!-- burner -->
  <linearGradient id="bronze" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#120b05"/><stop offset=".22" stop-color="#4b3519"/><stop offset=".4" stop-color="#a8864e"/><stop offset=".5" stop-color="#6f5128"/><stop offset=".78" stop-color="#33230f"/><stop offset="1" stop-color="#0c0703"/>
  </linearGradient>
  <linearGradient id="bronzeV" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".6"/>
  </linearGradient>
  <radialGradient id="ash" cx=".45" cy=".4" r=".7">
    <stop offset="0" stop-color="#a59f95"/><stop offset=".7" stop-color="#77716a"/><stop offset="1" stop-color="#3d3934"/>
  </radialGradient>
  <radialGradient id="ember"><stop offset="0" stop-color="#fff0c0"/><stop offset=".35" stop-color="#ff8a30"/><stop offset="1" stop-color="#ff4a00" stop-opacity="0"/></radialGradient>

  <clipPath id="bodyClip"><rect x="46" y="152" width="228" height="488"/></clipPath>
</defs>

</g>

  <path d="M734,706 C760,716 840,716 866,706" fill="none" stroke="#c9a565" stroke-opacity=".25" stroke-width=".8"/>
  <!-- rim -->
  <ellipse cx="800" cy="684" rx="73" ry="11" fill="url(#bronze)"/>
  <ellipse cx="800" cy="684.5" rx="66" ry="8.5" fill="url(#ash)"/>
  <ellipse cx="800" cy="683" rx="66" ry="8.5" fill="none" stroke="#000" stroke-opacity=".5" stroke-width="1.2"/>
  <g id="sticks"></g>
</g>
</svg>
<div id="vignette"></div>
<canvas id="smoke"></canvas>
<button id="offer" type="button">上香</button>

<script>
(function(){
var NS='http://www.w3.org/2000/svg';
var svg=document.getElementById('scene');
function el(n,a,p){var e=document.createElementNS(NS,n);for(var k in a)e.setAttribute(k,a[k]);if(p)p.appendChild(e);return e;}

/* ---- inscription ---- */
var ins=document.getElementById('inscription');
function col(text,x,y0,step,size){for(var i=0;i<text.length;i++){var t=el('text',{x:x,y:y0+i*step,'font-size':size,'class':'char'},ins);t.textContent=text[i];}}
// 正中：恩師錢公諱謙益〔字受之｜號牧齋〕之靈位
col('恩師錢公諱謙益',160,202,36.5,33);
col('字受之',169,447,17,15);
col('號牧齋',151,447,17,15);
col('之靈位',160,506,36.5,33);
// 右：生年　左：卒年　左下：立牌
col('生於明萬曆十年壬午九月二十六日',216,236,15.5,13.5);
col('卒於清康熙三年甲辰五月二十四日',104,236,15.5,13.5);
col('受業門生敬立',104,512,15.5,12.5);

/* ---- incense sticks ---- */
var sticksG=document.getElementById('sticks');
var defs=[{x:791,r:-4},{x:800,r:0},{x:809,r:4}];
var L=112,H=14,BURN=10*60*1000;
var sticks=defs.map(function(d){
  var g=el('g',{transform:'translate('+d.x+' 683) rotate('+d.r+')'},sticksG);
  el('rect',{x:-.9,y:-H,width:1.8,height:H+1,fill:'#a5261b'},g);
  var body=el('rect',{x:-1.25,y:-H-L,width:2.5,height:L,fill:'#6a4a2e'},g);
  var shade=el('rect',{x:.35,y:-H-L,width:.9,height:L,fill:'#000',opacity:.35},g);
  var ashT=el('rect',{x:-1.2,y:-H-L-3,width:2.4,height:3,fill:'#a8a39b'},g);
  var glow=el('circle',{cx:0,cy:-H-L,r:5,fill:'url(#ember)',opacity:.8},g);
  var dot=el('circle',{cx:0,cy:-H-L,r:1.4,fill:'#ffb060'},g);
  return {d:d,g:g,body:body,shade:shade,ashT:ashT,glow:glow,dot:dot,len:L};
});
var start=performance.now()-BURN*.3;
function setLen(s,len,burning){
  var top=-H-len;
  s.body.setAttribute('y',top);s.body.setAttribute('height',len);
  s.shade.setAttribute('y',top);s.shade.setAttribute('height',len);
  s.ashT.setAttribute('y',top-3);
  s.glow.setAttribute('cy',top);s.dot.setAttribute('cy',top);
  var v=burning?'visible':'hidden';s.glow.style.visibility=v;s.dot.style.visibility=v;s.ashT.style.visibility=len>0?'visible':'hidden';
  s.len=len;s.burning=burning;
}

/* ---- candles ---- */
var flames=[].slice.call(document.querySelectorAll('.candle .flame'));
var halos=[].slice.call(document.querySelectorAll('.candle .halo'));
var specL=document.getElementById('specL'),specR=document.getElementById('specR');
var wallLight=document.getElementById('wallLight');
var refl=document.getElementById('reflections');
function noise(t,s){return Math.sin(t*1.7+s)*.5+Math.sin(t*3.1+s*2.3)*.3+Math.sin(t*7.3+s*.7)*.2;}

/* ---- smoke ---- */
var cv=document.getElementById('smoke'),cx=cv.getContext('2d');
var dpr=Math.min(window.devicePixelRatio||1,2),W=0,Hh=0;
function resize(){W=innerWidth;Hh=innerHeight;cv.width=W*dpr;cv.height=Hh*dpr;cx.setTransform(dpr,0,0,dpr,0,0);}
resize();addEventListener('resize',resize);
var sprite=document.createElement('canvas');sprite.width=sprite.height=64;
(function(){var c=sprite.getContext('2d'),g=c.createRadialGradient(32,32,0,32,32,32);g.addColorStop(0,'rgba(214,214,220,1)');g.addColorStop(.4,'rgba(200,200,208,.45)');g.addColorStop(1,'rgba(190,190,200,0)');c.fillStyle=g;c.fillRect(0,0,64,64);})();
var parts=[],acc=[0,0,0];
function tipScreen(s){
  var m=s.g.getScreenCTM();if(!m)return null;
  var p=svg.createSVGPoint();p.x=0;p.y=-H-s.len-3;return p.matrixTransform(m);
}
function unit(){var m=svg.getScreenCTM();return m?m.a:1;}

var last=performance.now();
function frame(now){
  var dt=Math.min(.05,(now-last)/1000);last=now;var t=now/1000;
  // incense
  var p=Math.min(1,(now-start)/BURN);
  sticks.forEach(function(s,i){var len=L*(1-p)*(1-.04*i)+ (p<1?0:0);setLen(s,Math.max(0,len),p<1);
    if(p<1){var e=.75+.25*Math.sin(t*2.3+i*1.9);s.glow.setAttribute('opacity',e.toFixed(2));}});
  // candles
  var lightSum=0;
  flames.forEach(function(f,i){var n=noise(t*2.2,i*5.1),n2=noise(t*3.7,i*2.7+9);
    var sy=1+n*.07,sk=n2*2.2;f.setAttribute('transform','translate(0 474) skewX('+sk.toFixed(2)+') scale('+(1-n*.03).toFixed(3)+' '+sy.toFixed(3)+') translate(0 -474)');
    var h=.85+n*.12;halos[i].setAttribute('opacity',h.toFixed(3));lightSum+=h;});
  var l0=halos[0].getAttribute('opacity'),l1=halos[1].getAttribute('opacity');
  specL.setAttribute('opacity',(.055+ (l0-.85)*.12).toFixed(3));specR.setAttribute('opacity',(.055+(l1-.85)*.12).toFixed(3));
  wallLight.setAttribute('opacity',(.3+(lightSum/2-.85)*.25).toFixed(3));
  refl.setAttribute('opacity',(lightSum/2).toFixed(3));
  // smoke
  var u=unit();
  sticks.forEach(function(s,i){if(!s.burning)return;var tp=tipScreen(s);if(!tp)return;acc[i]+=dt*20;
    while(acc[i]>=1){acc[i]-=1;parts.push({x:tp.x,y:tp.y,x0:tp.x,a:0,life:10+Math.random()*4,ph:Math.random()*6.28,sp:(24+Math.random()*8)*u,seed:i*1.7+Math.random()*.4});}});
  cx.clearRect(0,0,W,Hh);
  var wind=Math.sin(t*.13)*6*u;
  for(var k=parts.length-1;k>=0;k--){var q=parts[k];q.a+=dt;var r=q.a/q.life;if(r>=1||q.y<-40){parts.splice(k,1);continue;}
    q.y-=q.sp*dt*(1-r*.35);
    var turb=Math.pow(r,1.4)*28*u;
    q.x=q.x0+wind*r*3+Math.sin(q.a*.9+q.seed+(q.y/(40*u)))*turb+Math.sin(q.a*2.1+q.ph)*turb*.25;
    var size=(1.5+r*30)*u;
    var al=.17*Math.pow(1-r,1.5)*Math.min(1,r*12);
    cx.globalAlpha=al;cx.drawImage(sprite,q.x-size,q.y-size,size*2,size*2);}
  cx.globalAlpha=1;
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

/* ---- offer incense ---- */
var btn=document.getElementById('offer');
btn.addEventListener('click',function(){
  btn.disabled=true;start=performance.now();
  sticksG.classList.remove('fadein');void sticksG.getBBox();sticksG.classList.add('fadein');
  setTimeout(function(){btn.disabled=false;},4000);
});
})();
</script>
</body>
</html>
